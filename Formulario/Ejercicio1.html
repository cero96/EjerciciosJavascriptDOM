<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Asistencia</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="data:,">
</head>

<body>

    <h1 id="titulo">Registro de Asistencia</h1>

    <main class="contenedor">

        <!-- =========================
             FORMULARIO
        ========================== -->

        <section class="formulario">

            <h3>Datos Personales</h3>

            <form id="formulario">

                <!-- Nombre -->
                <label for="nombre">Ingresa tu Nombre</label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Nombre"
                    autocomplete="given-name"
                    required
                >


                <!-- Apellido -->
                <label for="apellido">Ingresa tu Apellido</label>

                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    placeholder="Apellido"
                    autocomplete="family-name"
                    required
                >


                <!-- Edad -->
                <label for="edad">Ingresa tu Edad</label>

                <input
                    type="number"
                    id="edad"
                    name="edad"
                    placeholder="Edad"
                    min="1"
                    max="120"
                    required
                >


                <!-- Correo -->
                <label for="correo">Ingresa tu Correo</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Correo"
                    autocomplete="email"
                    required
                >


                <!-- Teléfono -->
                <label for="telefono">Ingresa tu Teléfono</label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Teléfono"
                    autocomplete="tel"
                    required
                >


                <!-- Botón -->
                <button
                    type="button"
                    id="boton"
                >
                    Guardar Datos
                </button>

            </form>

        </section>


        <!-- =========================
             RESULTADO
        ========================== -->

        <section class="resultado-container">

            <h3>Resultado</h3>

            <div id="resultado">
                <p>👤 Aquí aparecerán los datos registrados</p>
            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="main.js"></script>

</body>

</html>
