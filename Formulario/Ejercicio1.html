<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="data:,">
</head>

<body>

    <h1 id="titulo">Registro de Asistencia</h1>

    <div class="contenedor">

        <!-- FORMULARIO -->
        <div class="formulario">

            <h3>Datos Personales</h3>

            <h6>Ingresa tu Nombre</h6>
            <input
                type="text"
                id="nombre"
                placeholder="Nombre"
            >

            <h6>Ingresa tu Apellido</h6>
            <input
                type="text"
                id="apellido"
                placeholder="Apellido"
            >

            <h6>Ingresa tu Edad</h6>
            <input
                type="text"
                id="edad"
                placeholder="Edad"
            >

            <h6>Ingresa tu Correo</h6>
            <input
                type="text"
                id="correo"
                placeholder="Correo"
            >

            <h6>Ingresa tu Teléfono</h6>
            <input
                type="text"
                id="telefono"
                placeholder="Teléfono"
            >

            <button id="boton">
                Guardar Datos
            </button>

        </div>


        <!-- RESULTADO -->
        <div class="resultado-container">

            <h3>Resultado</h3>

            <div id="resultado">
                Aquí aparecerán los datos registrados
            </div>

        </div>

    </div>


    <script src="main.js"></script>

</body>

</html>
